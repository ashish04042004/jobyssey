# Render Blueprint: the API (with the background worker in-process) and its Redis.
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
services:
  - type: web
    name: jobyssey-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free instances have no pre-deploy step, so migrations run on boot.
    # `migrate deploy` only applies pending migrations and is safe to repeat.
    dockerCommand: sh -c "./node_modules/.bin/prisma migrate deploy && node src/server.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: DATABASE_URL # Supabase session pooler (port 5432)
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: jobyssey-redis
          property: connectionString
      - key: CORS_ORIGINS # https://<project>.pages.dev
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: PROXY_SECRET # same value as the Cloudflare Pages secret
        sync: false
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documents

  - type: keyvalue
    name: jobyssey-redis
    plan: free
    region: singapore
    # BullMQ must never have its keys evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections from Render services only
