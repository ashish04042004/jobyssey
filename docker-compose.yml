name: jobyssey

x-backend-env: &backend-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgresql://jobyssey:jobyssey@postgres:5432/jobyssey?schema=public
  REDIS_URL: redis://redis:6379
  CORS_ORIGINS: http://localhost:5173
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-0123456789}
  # Local Docker serves plain HTTP; real deployments must keep the default (true).
  COOKIE_SECURE: "false"
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: /app/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobyssey
      POSTGRES_PASSWORD: jobyssey
      POSTGRES_DB: jobyssey
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobyssey -d jobyssey"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    image: jobyssey-backend:local
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: jobyssey-backend:local
    command: ["node", "src/server.js"]
    environment:
      <<: *backend-env
      PORT: 4000
    ports:
      - "${API_PORT:-4001}:4000"
    volumes:
      - documents:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: ./backend
    image: jobyssey-backend:local
    command: ["node", "src/worker.js"]
    environment: *backend-env
    volumes:
      - documents:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  documents:
